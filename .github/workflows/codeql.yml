# SPDX-License-Identifier: MPL-2.0
name: "🔴 GATE: CodeQL"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    uses: hyperpolymath/standards/.github/workflows/codeql-reusable.yml@b935e63937b1f1b5cbaeea7e375947d7b924038f # main 2026-10-06 (after standards#1167)
    secrets: inherit
    with:
      # CodeQL has no Julia extractor; the default (javascript-typescript)
      # finds no source here and fails finalising an empty database.
      # Analyse the workflows instead.
      language: actions
