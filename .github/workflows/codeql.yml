# SPDX-License-Identifier: MPL-2.0
name: "🔴 GATE: CodeQL"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    uses: hyperpolymath/standards/.github/workflows/codeql-reusable.yml@5751b97ed597e560573242f56f1287db159edd00 # main 2026-10-06 (includes standards#1138 UUID dependency exemption)
    secrets: inherit
    with:
      # CodeQL has no Julia extractor; the default (javascript-typescript)
      # finds no source here and fails finalising an empty database.
      # Analyse the workflows instead.
      language: actions
