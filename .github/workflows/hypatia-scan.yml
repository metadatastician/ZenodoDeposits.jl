# SPDX-License-Identifier: MPL-2.0
name: "🔴 GATE: Hypatia Security Scan"

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    uses: hyperpolymath/standards/.github/workflows/hypatia-scan-reusable.yml@5751b97ed597e560573242f56f1287db159edd00 # main 2026-10-06 (includes standards#1138 UUID dependency exemption)
    secrets: inherit
