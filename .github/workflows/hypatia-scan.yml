# SPDX-License-Identifier: MPL-2.0
name: "🔴 GATE: Hypatia Security Scan"

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    uses: hyperpolymath/standards/.github/workflows/hypatia-scan-reusable.yml@b935e63937b1f1b5cbaeea7e375947d7b924038f # main 2026-10-06 (after standards#1167)
    secrets: inherit
