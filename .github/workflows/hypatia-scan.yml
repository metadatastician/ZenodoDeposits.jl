# SPDX-License-Identifier: MPL-2.0
name: "🔴 GATE: Hypatia Security Scan"

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    uses: metadatastician/standards/.github/workflows/hypatia-scan-reusable.yml@60382738566ffbb7d6bf364b12f4f583e12af750 # main 2026-10-06 (after standards#1185)
    secrets: inherit
