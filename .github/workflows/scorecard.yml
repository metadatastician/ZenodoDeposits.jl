# SPDX-License-Identifier: PMPL-1.0-or-later
name: "🟡 CHECK: OSSF Scorecard"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write
  id-token: write

jobs:
  scorecard:
    name: OSSF Scorecard Check
    uses: metadatastician/standards/.github/workflows/scorecard-reusable.yml@60382738566ffbb7d6bf364b12f4f583e12af750 # main 2026-10-06 (after standards#1185)
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
