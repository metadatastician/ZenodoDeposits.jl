# SPDX-License-Identifier: PMPL-1.0-or-later
name: "🟡 CHECK: OSSF Scorecard"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write
  id-token: write

jobs:
  scorecard:
    name: OSSF Scorecard Check
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@5751b97ed597e560573242f56f1287db159edd00 # main 2026-10-06 (includes standards#1138 UUID dependency exemption)
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
