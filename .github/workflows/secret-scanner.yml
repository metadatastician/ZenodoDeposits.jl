name: "🔴 GATE: Secret Scanner"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@7d51f30f992b51fe2b33119761901c594e266e82 # main 2026-10-06 (after standards#1185)
    secrets: inherit
