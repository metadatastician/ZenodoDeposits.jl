name: "🔴 GATE: Secret Scanner"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@b935e63937b1f1b5cbaeea7e375947d7b924038f # main 2026-10-06 (after standards#1167)
    secrets: inherit
